<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">NavisWORLD cosmic GitHub README hero</title>
  <desc id="desc">Dark terminal-style banner with a cosmic hooded ASCII figure and a technical profile panel.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
      .body{fill:#c9d1d9;font-size:22px}
      .label{fill:#79c0ff;font-size:22px;font-weight:700}
      .icon{fill:#a371f7;font-size:28px;font-weight:700}
      .tiny{fill:#8b949e;font-size:18px}
    </style>
  </defs>

  <rect width="1600" height="700" fill="#0d1117"/>
  <rect x="10" y="10" width="1580" height="680" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="38" y="48" class="mono" fill="#c9d1d9" font-size="20">NavisWORLD / README.md</text>

  <!-- stars -->
  <g class="mono" font-size="19" fill="#b9a8ff">
    <text x="86" y="114">+</text><text x="125" y="90">·</text><text x="168" y="130">*</text><text x="214" y="95">+</text>
    <text x="264" y="142">·</text><text x="306" y="106">+</text><text x="354" y="86">·</text><text x="410" y="118">*</text>
    <text x="454" y="94">+</text><text x="503" y="136">·</text><text x="552" y="100">+</text><text x="612" y="124">*</text>
    <text x="654" y="90">·</text><text x="696" y="142">+</text><text x="112" y="180">·</text><text x="642" y="184">·</text>
    <text x="154" y="226">+</text><text x="684" y="234">*</text><text x="92" y="292">·</text><text x="704" y="316">+</text>
    <text x="112" y="372">*</text><text x="690" y="388">·</text><text x="142" y="462">+</text><text x="666" y="486">*</text>
    <text x="98" y="546">·</text><text x="704" y="566">+</text>
  </g>

  <!-- crescent -->
  <circle cx="82" cy="126" r="35" fill="#7c5cff" filter="url(#glow)"/>
  <circle cx="99" cy="113" r="35" fill="#0d1117"/>

  <!-- Hooded ASCII-style figure -->
  <g class="mono" text-anchor="middle" filter="url(#glow)">
    <text x="395" y="126" fill="#79c0ff" font-size="15">.  +  .   *   .  +  .</text>
    <text x="395" y="149" fill="#79c0ff" font-size="15">..::++**########**++::..</text>
    <text x="395" y="172" fill="#79c0ff" font-size="15">.::+*##@@@@@@@@@@@@##*+::.</text>
    <text x="395" y="195" fill="#79c0ff" font-size="15">:+*#@@@%#*++++++*#%@@@#*+:</text>
    <text x="395" y="218" fill="#79c0ff" font-size="15">:*#@@%*=:.      .:=*%@@#*:</text>
    <text x="395" y="241" fill="#79c0ff" font-size="15">+#@@%=.    ....    .=%@@#+</text>
    <text x="395" y="264" fill="#8b5cf6" font-size="15">#@@#:   .::::::::.   :#@@#</text>
    <text x="395" y="287" fill="#8b5cf6" font-size="15">@@@*   :| | | | |:   *@@@</text>
    <text x="395" y="310" fill="#8b5cf6" font-size="15">@@@*   :| | | | |:   *@@@</text>
    <text x="395" y="333" fill="#79c0ff" font-size="15">#@@#:   '::::::::'   :#@@#</text>
    <text x="395" y="356" fill="#79c0ff" font-size="15">*@@@%*=:..      ..:=*%@@@*</text>
    <text x="395" y="379" fill="#79c0ff" font-size="15">:+#@@@@%#**++++**#%@@@@#+:</text>
    <text x="395" y="402" fill="#79c0ff" font-size="15">.:=*#@@@@@@@@@@@@@@#*=:. </text>
    <text x="395" y="425" fill="#79c0ff" font-size="15">.::=+*#%%@@@@@@@@%%#*+=::.</text>
    <text x="395" y="448" fill="#79c0ff" font-size="15">:+#@@%#*+=::::::::=+*#%@@#+:</text>
    <text x="395" y="471" fill="#79c0ff" font-size="15">*@@@#+=-.            .-=+#@@@*</text>
    <text x="395" y="494" fill="#79c0ff" font-size="15">@@#+-.       .:::.       .-+#@@</text>
    <text x="395" y="517" fill="#79c0ff" font-size="15">@#=.      .:+*****+:.      .=#@</text>
    <text x="395" y="540" fill="#79c0ff" font-size="15">#=.     .:+*#%%%%%#*+:.     .=#</text>
    <text x="395" y="563" fill="#79c0ff" font-size="15">=.    .:+#%@@@@@@@@@%#+:.    .=</text>
    <text x="395" y="586" fill="#79c0ff" font-size="15">.   .:+#@@@@@@@@@@@@@@@#+:.   .</text>
  </g>

  <!-- chest galaxy -->
  <g transform="translate(395 476) rotate(-12)" fill="none" filter="url(#glow)">
    <ellipse rx="92" ry="34" stroke="#a371f7" stroke-width="4"/>
    <ellipse rx="66" ry="23" stroke="#8b5cf6" stroke-width="3"/>
    <ellipse rx="40" ry="14" stroke="#58a6ff" stroke-width="3"/>
    <circle r="7" fill="#d2a8ff" stroke="none"/>
    <circle cx="-70" cy="-10" r="4" fill="#58a6ff" stroke="none"/>
    <circle cx="56" cy="13" r="4" fill="#a371f7" stroke="none"/>
  </g>

  <!-- right terminal panel -->
  <rect x="735" y="78" width="820" height="475" rx="4" fill="url(#panel)" stroke="url(#accent)" stroke-width="2.2"/>

  <g class="mono">
    <text x="772" y="132" class="icon">▣</text>
    <text x="822" y="132" class="label">OS</text>
    <text x="908" y="132" class="label">:</text>
    <text x="958" y="132" class="body">Windows, Linux, Android</text>

    <text x="772" y="193" class="icon">&lt;/&gt;</text>
    <text x="822" y="193" class="label">Stack</text>
    <text x="908" y="193" class="label">:</text>
    <text x="958" y="193" class="body">Python, Rust, C++, JavaScript,</text>
    <text x="958" y="221" class="body">HTML/CSS, Bash</text>

    <text x="772" y="282" class="icon">◉</text>
    <text x="822" y="282" class="label">Focus</text>
    <text x="908" y="282" class="label">:</text>
    <text x="958" y="282" class="body">AI, local memory systems,</text>
    <text x="958" y="310" class="body">autonomous tooling, simulations,</text>
    <text x="958" y="338" class="body">creative engines</text>

    <text x="772" y="399" class="icon">△</text>
    <text x="822" y="399" class="label">Research</text>
    <text x="930" y="399" class="label">:</text>
    <text x="958" y="399" class="body">Davis CST 12D, persistent memory,</text>
    <text x="958" y="427" class="body">sensor fusion, autonomous coding</text>

    <text x="772" y="488" class="icon">◇</text>
    <text x="822" y="488" class="label">Projects</text>
    <text x="930" y="488" class="label">:</text>
    <text x="958" y="488" class="body">COSMOS, ZEREF, Reality Bridge,</text>
    <text x="958" y="516" class="body">GENESIS, Synapse OS, QC67_cosmo</text>
  </g>

  <!-- mission row below panel to mimic reference -->
  <g class="mono">
    <text x="772" y="600" class="icon">☆</text>
    <text x="822" y="600" class="label">Mission</text>
    <text x="930" y="600" class="label">:</text>
    <text x="958" y="600" class="body">Build accessible, local, evolving</text>
    <text x="958" y="628" class="body">AI systems for people.</text>
  </g>

  <text x="748" y="672" class="mono" fill="#a371f7" font-size="20">“The universe is the software. We just write better interfaces.”</text>
  <rect x="1518" y="652" width="12" height="22" fill="#c9d1d9"/>
</svg>