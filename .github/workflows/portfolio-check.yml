name: Portfolio OS integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check os.js
          node --check ascii-ui.js

      - name: ASCII portfolio smoke test
        run: node tests/portfolio_ascii_smoke.mjs
